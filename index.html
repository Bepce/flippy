<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>flippy demo</title>
  <link rel="stylesheet" href="viewer/viewer.css?v=1">
  <style>html, body { height: 100%; margin: 0; }</style>
</head>
<body>
  <!-- The demo catalogue. Point data-src at your own catalogue folder (made with tools/build.py).
       Options are listed at the end of viewer/viewer.js and in README.md.
       Raise ?v= on the two viewer files when you update them, so browsers don't keep old copies. -->
  <div class="flippy" data-src="catalogues/hollowbrook/" style="height: 100%"></div>
  <script src="viewer/viewer.js?v=1"></script>
</body>
</html>
